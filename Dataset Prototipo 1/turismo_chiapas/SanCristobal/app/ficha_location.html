<!DOCTYPE html>
<html>
<head>
	<title></title>
</head>
<body>
<div>
	Selecciona un sitio temporal:
	<select id="id_temporal" onchange="mostrar_sitio()">
		<option value="1">Exposición del ámbar</option>
		<option value="2">Feria de cuxtitali</option>
		<option value="3">Feria de guadalupe</option>
		<option value="4">Feria de la merced</option>
		<option value="5">Feria de la primavera y de la paz</option>
		<option value="6">Feria de maría auxiliadora</option>
		<option value="7">Feria de mexicanos</option>
		<option value="8">Feria de san antonio</option>
		<option value="9">Feria de san cristóbal</option>
		<option value="10">Feria de san diego</option>
		<option value="11">Feria de san felipe</option>
		<option value="12">Feria de san francisco</option>
		<option value="13">Feria de santa lucía</option>
		<option value="14">Feria del carmen</option>
		<option value="15">Feria del cerrillo</option>
		<option value="16">Festival internacional cervantino barroco</option>		
	</select>
</div>

<script type="text/javascript">

function mostrar_sitio()
{
	var sitio_seleccionado = document.getElementById("id_temporal");

	switch(sitio_seleccionado.value)
	{
		case "1": archivo="at01"; break;
		case "2": archivo="at02"; break;
		case "3": archivo="at03"; break;
		case "4": archivo="at04"; break;
		case "5": archivo="at05"; break;
		case "6": archivo="at06"; break;
		case "7": archivo="at07"; break;
		case "8": archivo="at08"; break;
		case "9": archivo="at09"; break;
		case "10": archivo="at10"; break;
		case "11": archivo="at11"; break;
		case "12": archivo="at12"; break;
		case "13": archivo="at13"; break;
		case "14": archivo="at14"; break;
		case "15": archivo="at15"; break;
		case "16": archivo="at16"; break;
				
	}

	archivo="xml_individual/"+archivo+".xml";

		var imagen = 'imagenes/geo_temporal.png';
	  	var lat, lng;

		if (window.XMLHttpRequest)
      	{// code for IE7+, Firefox, Chrome, Opera, Safari
        	xmlhttp=new XMLHttpRequest();
      	}
      	else
      	{// code for IE6, IE5
       		xmlhttp=new ActiveXObject("Microsoft.XMLHTTP");
      	}
      xmlhttp.open("GET",archivo,false);
      xmlhttp.send();
      xmlDoc=xmlhttp.responseXML;
	  
	  // tranferir datos del xml de marcadores a variables para el mapa
	  
	  x=xmlDoc.getElementsByTagName("marcador");
      for(i=0;i<x.length;i++)
      {
	    id = x[i].getAttribute("id");
	    lat = parseFloat(x[i].getAttribute("lat"));
        lng = parseFloat(x[i].getAttribute("lng"));
		nombre = x[i].getAttribute("nombre");
	    var location = new google.maps.LatLng(lat, lng);
        marker = new google.maps.Marker( {position:location, map:map, icon:imagen, title:nombre } );
		infoMarkers_temporal(marker, id);
        markersArray.push(marker);
	 }
	}

	function infoMarkers_temporal(markers, address)
    {
      google.maps.event.addListener(markers, 'click', function() 
	  {
	    $.fancybox.open({href : 'atomos_temporales/at'+address+'.html', type : 'iframe'});
	  });
    }

    function limpiar_mapa() 
    {
      if (markersArray) 
	  {
        for (i in markersArray) 
		{
          markersArray[i].setMap(null);
        }
      } 
    }
</script>

</body>
</html>
